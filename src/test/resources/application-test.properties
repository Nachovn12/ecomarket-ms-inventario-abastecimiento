spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Clave secreta fija EXCLUSIVA para pruebas automatizadas (H2/Unit Tests) - NUNCA en producción
jwt.secret=EcoMarketSpATestSecretKeyHS256ForAutomatedTestsOnly2026x9876543210
jwt.expiration-hours=2

